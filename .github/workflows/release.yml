name: FileOrbit packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Package ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, rid: win-x64 }
          - { runner: macos-15, rid: osx-arm64 }
          - { runner: macos-15-intel, rid: osx-x64 }
          - { runner: ubuntu-24.04, rid: linux-x64 }
          - { runner: ubuntu-24.04-arm, rid: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Core tests
        run: dotnet test tests/FileOrbit.Core.Tests -c Release -m:1
      - name: macOS package
        if: runner.os == 'macOS'
        run: sh build/build-fileorbit-macos.sh Releases
      - name: Linux package
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./build/build-portable.ps1 -Runtime ${{ matrix.rid }} -SkipFonts
      - name: Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/build-fileorbit-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: FileOrbit-${{ matrix.rid }}
          path: Releases/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --title "FileOrbit $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
