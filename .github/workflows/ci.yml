name: FileOrbit checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build src/Filee.App -c Release -m:1
      - run: dotnet test tests/Filee.Core.Tests -c Release -m:1
      - run: dotnet test tests/Filee.App.Tests -c Release -m:1 --filter "FullyQualifiedName~FileOrbitTests|FullyQualifiedName~Radial|FullyQualifiedName~DonutFlip|FullyQualifiedName~Localization|FullyQualifiedName~SponsorTests"
